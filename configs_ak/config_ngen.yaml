
general:
  logging: # define logging configurations
    level: info  # logging level, options: debug, info, warning, error, critical
    log_to_file: True  # whether to log to a file
    file: '{base_dir}/outputs/ngen/{run_name}/ngen_{domain}_vpu{vpu}.log'
    
  # ----- fields unique to NGEN simulation (i.e., not in config_general.yaml) ----
  start_time: '2012-10-01T00:00:00'
  end_time: '2012-10-01T10:00:00'
  algorithm_list: ['kmeans']  # list of algorithms to use for parameter regionalization
  par_file: '{base_dir}/outputs/region/{run_name}/params/formulation_params_{algorithm_list}_{domain}_vpu{vpu}.csv'
  pair_file: '{base_dir}/outputs/region/{run_name}/pairs/pairs_{algorithm_list}_{domain}_vpu{vpu}_mswm.csv'
  config_template: 'default_mswm_template.txt'

output:
  ngen:
    save: true
    path: '{base_dir}/outputs/ngen/' # root directory for NGEN simulation inputs/outputs (with sub-folders created by MSWM as needed)
  config_final: # Final configuration file after processing and validation
    save: True
    path: '{base_dir}/outputs/ngen/{run_name}'
    stem: 'config_ngen_final_{domain}_vpu{vpu}'
    format: yaml